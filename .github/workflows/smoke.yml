name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production URL to test against'
        required: true
        default: 'https://infrahub-livid.vercel.app'

jobs:
  smoke:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test against production
        run: npx playwright test tests/e2e/smoke/smoke.spec.ts
        env:
          PLAYWRIGHT_ENV: production
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.PROD_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.PROD_TEST_USER_PASSWORD }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7